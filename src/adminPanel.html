    <script>
      App = {
        web3Provider: null,
        contracts: {},
        account: '0x0',

        init: async function() {
          return await App.initWeb3();
        },

        initWeb3: async function() {
          if (window.ethereum) {
            App.web3Provider = window.ethereum;
            try {
              await window.ethereum.request({ method: 'eth_requestAccounts' });
            } catch (error) {
              console.error("User denied account access");
            }
          } else if (window.web3) {
            App.web3Provider = window.web3.currentProvider;
          } else {
            App.web3Provider = new Web3.providers.HttpProvider('http://localhost:7545');
          }
          web3 = new Web3(App.web3Provider);
          return await App.initContract();
        },

        initContract: function() {
          $.getJSON('../build/contracts/Product.json', function(data) {
            var ProductArtifact = data;
            App.contracts.Product = TruffleContract(ProductArtifact);
            App.contracts.Product.setProvider(App.web3Provider);
            
            // Get account
            web3.eth.getCoinbase(function(err, account) {
              if (err === null) {
                App.account = account;
                console.log("Admin Account:", App.account);
              }
            });
          });
        },

        viewManufacturer: async function() {
          const address = $('#manufacturerAddress').val().trim();
          if (!address) return alert("Please enter an address");

          try {
            const instance = await App.contracts.Product.deployed();
            const isVerified = await instance.isVerifiedManufacturer(address);
            const mfgId = await instance.getManufacturerId(address);
            
            const detailsDiv = $('#manufacturerDetails');
            detailsDiv.show();
            
            let statusHtml = isVerified 
              ? '<span style="color: green;">✅ Verified & Active</span>' 
              : '<span style="color: orange;">⏳ Pending Verification</span>';

            detailsDiv.html(`
              <h3>📋 Manufacturer Details</h3>
              <p><strong>Wallet Address:</strong> ${address}</p>
              <p><strong>Manufacturer ID:</strong> ${web3.toAscii(mfgId) || 'Not Registered'}</p>
              <p><strong>Registration Status:</strong> ${statusHtml}</p>
              
              <div style="margin-top: 25px; padding-top: 15px; border-top: 1px solid #ddd;">
                <h4>Admin Actions:</h4>
                ${!isVerified ? `
                  <button class="btn btn-success" onclick="App.verifyManufacturer('${address}')">
                    ✅ Verify Manufacturer
                  </button>
                ` : '<p>Manufacturer already verified.</p>'}
              </div>
            `);
          } catch (error) {
            console.error(error);
            alert("Error fetching manufacturer details. Is the contract deployed?");
          }
        },

        verifyManufacturer: async function(address) {
          try {
            const instance = await App.contracts.Product.deployed();
            
            // Show pending message
            alert("Please confirm the transaction in MetaMask...");
            
            const result = await instance.verifyManufacturer(address, { from: App.account });
            
            console.log("Transaction Result:", result);
            alert("✅ Manufacturer verified successfully! Transaction: " + result.tx);
            App.viewManufacturer(); // Refresh view
          } catch (error) {
            console.error(error);
            alert("Transaction failed: " + error.message);
          }
        }
      };

      $(function() {
