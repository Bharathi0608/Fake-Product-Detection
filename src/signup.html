                // Restore button

                submitBtn.disabled = false;

            font-size: 14px;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
        }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        button[type="submit"]:hover {
            background-color: #45a049;
        }
        button[type="submit"]:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        .back-button {
            background: none;
            border: none;
            color: #007bff;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 20px;
            padding: 5px 0;
        }
        .back-button:hover {
            text-decoration: underline;
        }
        .toggle-form {
            text-align: center;
            margin-top: 15px;
            color: #666;
        }
        .toggle-form a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: bold;
        }
        .toggle-form a:hover {
            text-decoration: underline;
        }
        .message-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 5px;
            display: none;
            text-align: center;
            font-size: 14px;
        }
        .error-message {
            background-color: #ffebee;
            color: #d32f2f;
            border: 1px solid #f44336;
        }
        .success-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #4CAF50;
        }
        .form-title {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <button class="back-button" onclick="window.location.href='index.html'">← Back to Home</button>
        <h2 class="form-title">Create Account</h2>
        
        <form id="signupFormElement">
            <div class="form-group">
                <label for="signupName">Full Name</label>
                <input type="text" id="signupName" required placeholder="Enter your full name">
            </div>
            <div class="form-group">
                <label for="signupEmail">Email Address</label>
                <input type="email" id="signupEmail" required placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input type="password" id="signupPassword" required placeholder="Create a password (min. 6 characters)">
            </div>
           <!-- <div class="form-group">
                <label for="signupRole">Select Role</label>
                <select id="signupRole" required>
                    <option value="">Choose your role</option>
                    <option value="manufacturer">Manufacturer</option>
                    <option value="seller">Seller</option>
                    <option value="consumer">Consumer</option>
                </select>
            </div> -->
            <button type="submit" id="signupButton">Sign Up</button>
            <div class="toggle-form">
                Already have an account? <a href="login.html">Log In</a>
            </div>
            <div id="signupMessage" class="message-box"></div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Signup page loaded');
            
            // Add form submit handler
            document.getElementById('signupFormElement').addEventListener('submit', handleSignup);
            
            // Remove any stored signup data
            localStorage.removeItem('lastSignupEmail');
            localStorage.removeItem('lastSignupRole');
        });

       async function handleSignup(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('signupButton');
    const originalText = submitBtn.textContent;

    submitBtn.textContent = 'Creating Account...';
    submitBtn.disabled = true;

    try {
        const formData = getFormData();

        // ❗ IMPORTANT: if validation failed, stop safely
        if (!formData) {
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
            return;
        }

        const response = await fetch('http://localhost:5000/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (!response.ok) {
            showMessage(data.error || 'Registration failed', 'error');
            submitBtn.textContent = originalText;
            submitBtn.disabled = false;
            return;
        }

        showMessage('✅ Account created successfully! Redirecting...', 'success');

        // cleanup
        localStorage.removeItem('selectedRole');
        localStorage.setItem('lastSignupEmail', formData.email);

        setTimeout(() => {
            window.location.href = 'login.html';
        }, 1500);

    } catch (err) {
        console.error(err);
        showMessage('Unable to connect to server.', 'error');
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
}


        function getFormData() {
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;

    const role = localStorage.getItem('selectedRole');

    if (!role) {
        alert('Invalid signup access. Please choose a role first.');
        window.location.href = 'index.html';
        return null;
    }

    if (!name || !email || !password) {
        showMessage('Please fill all required fields', 'error');
        return null;
    }

    if (!email.endsWith('@gmail.com')) {
        showMessage('Email must end with @gmail.com', 'error');
        return null;
    }

    if (password.length < 6) {
        showMessage('Password must be at least 6 characters', 'error');
        return null;
    }

    return {
        name,
        email,
        password,
        role
    };
}


        function showMessage(message, type) {
            const messageDiv = document.getElementById('signupMessage');
            messageDiv.textContent = message;
            messageDiv.className = 'message-box ' + (type === 'error' ? 'error-message' : 'success-message');
            messageDiv.style.display = 'block';
            
            // Clear error messages after 5 seconds, success messages after 3 seconds
            const clearTime = type === 'error' ? 5000 : 3000;
            setTimeout(() => {
                messageDiv.textContent = '';
                messageDiv.style.display = 'none';
            }, clearTime);
        }
    </script>
</body>
</html>
